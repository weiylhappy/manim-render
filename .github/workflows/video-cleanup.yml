name: Video Cleanup

on:
  workflow_dispatch:
    inputs:
      cos_video_url:
        description: '原始视频 COS 下载地址'
        required: true
      watermark_region:
        description: '水印区域 x,y,w,h（可空）'
        required: false
        default: ''
      subtitle_region:
        description: '字幕区域 x,y,w,h（可空）'
        required: false
        default: ''
      cleanup_type:
        description: '处理类型: watermark / subtitle / both'
        required: true
        default: 'both'
      callback_url:
        description: '处理完成后回调的 API 地址'
        required: false
      task_id:
        description: '任务ID，用于回调时标识'
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-opencv python3-numpy python3-requests

      - name: 运行去水印/去字幕处理
        env:
          COS_VIDEO_URL: ${{ inputs.cos_video_url }}
          WATERMARK_REGION: ${{ inputs.watermark_region }}
          SUBTITLE_REGION: ${{ inputs.subtitle_region }}
          CLEANUP_TYPE: ${{ inputs.cleanup_type }}
          TASK_ID: ${{ inputs.task_id }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          python3 modelscope/video_cleanup_process.py

      - name: 失败回调
        if: ${{ failure() && inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          python3 modelscope/video_cleanup_notify_failure.py
