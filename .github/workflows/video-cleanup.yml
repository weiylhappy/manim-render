name: Video Cleanup (去水印/去字幕)

on:
  workflow_dispatch:
    inputs:
      cos_video_url:
        description: '原始视频的 COS 下载地址'
        required: true
        type: string
      cleanup_type:
        description: '清理类型: watermark / subtitle / both'
        required: true
        type: string
        default: 'subtitle'
      watermark_region:
        description: '水印区域 x,y,w,h（去水印时必填，相对原视频左上角）'
        required: false
        type: string
        default: ''
      subtitle_region:
        description: '字幕区域 x,y,w,h（去字幕时必填，相对原视频左上角）'
        required: false
        type: string
        default: ''
      algorithm:
        description: '修复算法: telea(默认,快速) / ns(Navier-Stokes,更平滑)'
        required: false
        type: string
        default: 'telea'
      callback_url:
        description: '处理完成后回调的 API 地址'
        required: false
        type: string
      task_id:
        description: '任务ID，用于回调时标识'
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. 检出仓库（获取处理脚本） ──────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 安装依赖 ─────────────────────────────────
      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 安装 Python 依赖
        run: |
          pip install --quiet opencv-python-headless numpy cos-python-sdk-v5 requests

      # ── 3. 下载原始视频 ─────────────────────────────
      - name: 下载原始视频
        env:
          VIDEO_URL: ${{ inputs.cos_video_url }}
        run: |
          echo "下载视频..."
          curl -fsSL "$VIDEO_URL" -o input_video.mp4
          echo "视频大小: $(du -h input_video.mp4 | cut -f1)"

      # ── 4. 运行去水印/去字幕处理 ─────────────────────
      - name: 运行视频清理
        env:
          CLEANUP_TYPE: ${{ inputs.cleanup_type }}
          WATERMARK_REGION: ${{ inputs.watermark_region }}
          SUBTITLE_REGION: ${{ inputs.subtitle_region }}
          ALGORITHM: ${{ inputs.algorithm }}
        run: |
          python3 modelscope/video_cleanup_process.py \
            --input input_video.mp4 \
            --output cleaned_output.mp4 \
            --cleanup_type "$CLEANUP_TYPE" \
            --watermark_region "$WATERMARK_REGION" \
            --subtitle_region "$SUBTITLE_REGION" \
            --algorithm "$ALGORITHM"

      # ── 5. 压缩输出视频 ─────────────────────────────
      - name: 压缩输出视频
        run: |
          echo "原始输出大小: $(du -h cleaned_output.mp4 | cut -f1)"
          ffmpeg -y -i cleaned_output.mp4 \
            -c:v libx264 -crf 28 -preset fast \
            -c:a aac -b:a 64k \
            -pix_fmt yuv420p \
            compressed_output.mp4 2>&1 | tail -3
          mv compressed_output.mp4 cleaned_output.mp4
          echo "压缩后大小: $(du -h cleaned_output.mp4 | cut -f1)"

      # ── 6. 上传结果到 COS ───────────────────────────
      - name: 上传结果到 COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          python3 modelscope/video_cleanup_upload.py

      # ── 7. 回调通知 ────────────────────────────────
      - name: 回调通知（成功）
        if: ${{ inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          python3 modelscope/video_cleanup_notify.py

      - name: 回调通知（失败）
        if: ${{ failure() && inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          python3 modelscope/video_cleanup_notify_failure.py
