name: Manim Render

on:
  workflow_dispatch:
    inputs:
      cos_scene_url:
        description: 'scene.py 的 COS 下载地址'
        required: true
        type: string
      scene_class:
        description: 'Manim 场景类名'
        required: true
        type: string
        default: 'MyScene'
      callback_url:
        description: '渲染完成后回调的 API 地址'
        required: false
        type: string
      task_id:
        description: '任务ID，用于回调时标识'
        required: false
        type: string
      narration_url:
        description: 'TTS 旁白音频 COS 下载地址（可选，传入则合成音视频）'
        required: false
        type: string
        default: ''
      quality:
        description: '渲染质量: l=480p15fps(调试), m=720p30fps, h=1080p60fps(正式)'
        required: false
        type: string
        default: 'l'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev pkg-config texlive-latex-base texlive-latex-extra texlive-fonts-recommended cm-super dvipng fonts-noto-cjk

      - name: 安装 Python 依赖
        run: |
          pip install --quiet manim edge-tts pydub cos-python-sdk-v5

      - name: 下载 scene.py 并渲染
        env:
          SCENE_URL: ${{ inputs.cos_scene_url }}
          SCENE_CLASS: ${{ inputs.scene_class }}
          QUALITY: ${{ inputs.quality }}
        run: |
          curl -fsSL "$SCENE_URL" -o scene.py
          echo "--- 渲染开始 (质量: $QUALITY) ---"
          manim -q"$QUALITY" scene.py "$SCENE_CLASS" --disable_caching
          echo "--- 渲染完成 ---"

      - name: 合成旁白音频（如有）
        if: ${{ inputs.narration_url != '' }}
        env:
          NARRATION_URL: ${{ inputs.narration_url }}
        run: |
          echo "下载旁白音频..."
          curl -fsSL "$NARRATION_URL" -o narration.mp3
          echo "查找视频..."
          VIDEO=$(find media/videos/scene -name "*.mp4" ! -path "*/partial_movie_files/*" | head -1)
          echo "视频: $VIDEO"
          echo "合成音视频..."
          ffmpeg -i "$VIDEO" -i narration.mp3 -c:v copy -c:a aac -b:a 192k -shortest -y combined.mp4
          echo "合成完成: combined.mp4"

      - name: 上传结果到 COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          python modelscope/upload_result.py

      - name: 回调通知
        if: ${{ inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          python modelscope/notify_callback.py
